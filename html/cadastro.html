<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro - Vida Nova Pet</title>
  <link rel="stylesheet" href="../css/style-cadastro.css">
  <link rel="stylesheet" href="../css/acessibilidade.css">
</head>

<body>

<!-- WIDGET -->
  <div class="accessibility-widget" aria-hidden="false">
    <button class="aw-toggle" id="aw-open" aria-expanded="false" aria-controls="aw-panel" title="Abrir opções de acessibilidade">
      ♿ <span class="sr-only">Abrir opções de acessibilidade</span>
    </button>

    <div class="aw-panel" id="aw-panel" role="region" aria-label="Controles de acessibilidade" aria-hidden="true">
      <div class="aw-controls" style="align-items:center; justify-content:space-between;">
        <strong>Acessibilidade</strong>
        <button id="aw-close" class="aw-btn small" title="Fechar painel" aria-label="Fechar painel">✕</button>
      </div>

      <button id="contrast-toggle" class="aw-btn" aria-pressed="false" aria-live="polite">
        <span>Alto contraste</span>
        <span class="aw-indicator" aria-hidden="true">Off</span>
      </button>

      <div style="display:flex;gap:.4rem;align-items:center;justify-content:space-between;">
        <span>Fonte</span>
        <div style="display:flex;gap:.4rem;">
          <button id="font-decrease" class="aw-btn small" title="Diminuir fonte" aria-label="Diminuir fonte">A−</button>
          <button id="font-reset" class="aw-btn small" title="Tamanho padrão" aria-label="Restaurar fonte">A</button>
          <button id="font-increase" class="aw-btn small" title="Aumentar fonte" aria-label="Aumentar fonte">A+</button>
        </div>
      </div>

      <div>
        <button id="aw-reset-all" class="aw-btn" title="Restaurar todas as configurações de acessibilidade">Restaurar padrões</button>
      </div>

      <div style="font-size:0.8rem;color:#666;padding-top:.2rem;">
        <span id="aw-status" aria-live="polite"></span>
      </div>
    </div>
  </div>
  
  <div class="cadastro-container">
    <div class="cadastro-card" role="region" aria-labelledby="cad-title">
      <a href="../index.html" class="close-btn" aria-label="Voltar para a página inicial">✖</a>
      <h1 id="cad-title">Cadastro</h1>

      <form id="cadastroForm" novalidate>
        <div class="form-grid">
          <label class="form-group">
            <span>Nome completo</span>
            <input type="text" name="nome" required autocomplete="name" />
          </label>

          <label class="form-group">
            <span>E-mail</span>
            <input type="email" name="email" required autocomplete="email" />
          </label>

          <label class="form-group">
            <span>CPF</span>
            <input id="cpf" type="text" name="cpf" inputmode="numeric" maxlength="14" required />
          </label>

          <label class="form-group">
            <span>Telefone</span>
            <input id="telefone" type="tel" name="telefone" inputmode="tel" maxlength="15" required />
          </label>

          <label class="form-group">
            <span>Data de nascimento</span>
            <input type="date" name="nascimento" required />
          </label>

          <label class="form-group full">
            <span>Endereço</span>
            <input type="text" name="endereco" required autocomplete="street-address" />
          </label>

          <label class="form-group">
            <span>CEP</span>
            <input id="cep" type="text" name="cep" inputmode="numeric" maxlength="9" required />
          </label>

          <label class="form-group">
            <span>Cidade</span>
            <input type="text" name="cidade" required />
          </label>

          <label class="form-group">
            <span>Estado</span>
            <select name="estado" required>
              <option value="" disabled selected>UF</option>
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
              <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
              <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
              <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
              <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
              <option>SP</option><option>SE</option><option>TO</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Enviar</button>
        </div>
      </form>
    </div>
  </div>

  

  <script src="../js/cadastro.js"></script>
  <script src="../js/acessibilidade.js"></script>
</body>
</html>
